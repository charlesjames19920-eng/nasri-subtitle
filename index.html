
<script>
const form = document.getElementById('jobForm');
const msg = document.getElementById('message');

const engineUrl = 'https://2645a59ce8dbc3143e.gradio.live';

form.addEventListener('submit', (e) => {
  e.preventDefault();

  const url = document.getElementById('movieUrl').value.trim();
  const file = document.getElementById('srtFile').files[0];
  const rights = document.getElementById('rights').checked;

  try {
    const parsed = new URL(url);
    if (!['http:', 'https:'].includes(parsed.protocol)) {
      throw new Error();
    }
  } catch {
    msg.textContent =
      'تحقق من رابط الفيلم. يجب أن يبدأ بـ https:// أو http://';
    msg.className = 'notice warning';
    return;
  }

  if (!file || !file.name.toLowerCase().endsWith('.srt')) {
    msg.textContent = 'اختر ملف ترجمة بامتداد SRT.';
    msg.className = 'notice warning';
    return;
  }

  if (!rights) {
    msg.textContent = 'يرجى تأكيد حقك في معالجة الفيديو.';
    msg.className = 'notice warning';
    return;
  }

  msg.textContent =
    'سيتم فتح محرك المعالجة. أدخل رابط الفيلم وارفع ملف SRT مرة أخرى في واجهة المحرك.';

  msg.className = 'notice';

  window.open(engineUrl, '_blank', 'noopener');
});
</script>
